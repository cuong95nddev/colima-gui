[package]
name = "colima-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
bollard = "0.21.1"
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
futures-util = "0.3.34"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSView", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tray-icon = "0.26.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
